{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Карта сети{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'mappy/css/base.css' %}">
    {% block extra_css %}{% endblock %}
</head>
<body>
    <nav class="navbar">
        <a href="{% url 'map' %}" class="navbar-brand">🗺 Карта сети</a>
        <div class="navbar-links">
            <a href="{% url 'map' %}">Карта</a>
            <a href="{% url 'device_list' %}">Устройства</a>
            <a href="{% url 'monitoring_history' %}">Мониторинг</a>
            <a href="/admin/">Админ</a>
        </div>
        {% if user.is_authenticated %}
        <div class="navbar-user">
            <span class="navbar-user-name">{{ user.get_username }}</span>
            <form method="post" action="{% url 'logout' %}" class="navbar-logout-form">
                {% csrf_token %}
                <button type="submit" class="navbar-logout-btn" title="Выйти из системы">Выйти</button>
            </form>
        </div>
        {% endif %}
    </nav>
    <main class="content">
        {% block content %}{% endblock %}
    </main>
    {% block extra_js %}{% endblock %}
</body>
</html>
