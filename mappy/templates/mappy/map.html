{% extends "mappy/base.html" %}
{% load static %}

{% block title %}WebMap — Карта России{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'mappy/css/map.css' %}">
{% endblock %}

{% block content %}
<div class="map-container">
    <div class="map-header">
        <h1>Интерактивная карта сети</h1>
    </div>

    <div class="russia-map-wrap" id="mapWrap" data-svg-url="{% static 'mappy/svg/russia_map.svg' %}">
        <div class="region-info-box" id="regionInfo">
            <div class="info-name" id="infoName"></div>
            <div class="info-id" id="infoId"></div>
        </div>
        <div class="zoom-controls">
            <button onclick="zoomIn()" title="Приблизить">+</button>
            <button onclick="zoomOut()" title="Отдалить">−</button>
            <button onclick="zoomReset()" title="Сброс">⌂</button>
        </div>
    </div>
</div>

<div class="toast-container" id="toasts"></div>
{% endblock %}

{% block extra_js %}
<script src="{% static 'mappy/js/common.js' %}"></script>
<script src="{% static 'mappy/js/map.js' %}"></script>
{% endblock %}
