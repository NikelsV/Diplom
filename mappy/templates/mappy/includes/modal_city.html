<div id="addCityModal" class="modal-overlay" style="display:none;">
    <div class="modal-box">
        <h2>Добавить город</h2>
        <div class="field-group"><label>Название</label><input id="newCityName" type="text" placeholder="Название города"></div>
        <div class="field-group"><label>X</label><input id="newCityX" type="number" step="0.1" readonly></div>
        <div class="field-group"><label>Y</label><input id="newCityY" type="number" step="0.1" readonly></div>
        <div class="modal-actions">
            <button class="btn-secondary" onclick="closeAddCityModal()">Отмена</button>
            <button class="btn-primary" onclick="confirmAddCity()">Создать</button>
        </div>
    </div>
</div>
