<div id="addDeviceModal" class="modal-overlay" style="display:none;">
    <div class="modal-box">
        <h2>Добавить устройство</h2>
        <div class="field-group"><label>Тип устройства</label><select id="newDeviceType"></select></div>
        <div class="field-group"><label>Название</label><input id="newDeviceName" type="text" placeholder="Новое устройство"></div>
        <div class="modal-actions">
            <button class="btn-secondary" onclick="closeAddDeviceModal()">Отмена</button>
            <button class="btn-primary" onclick="confirmAddDevice()">Добавить</button>
        </div>
    </div>
</div>
