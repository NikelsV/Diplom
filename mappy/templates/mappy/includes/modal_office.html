<div id="addOfficeModal" class="modal-overlay" style="display:none;">
    <div class="modal-box">
        <h2>Добавить офис</h2>
        <div class="field-group"><label>Название</label><input id="newOfficeName" type="text" placeholder="Офис на Арбате"></div>
        <div class="field-group"><label>Адрес</label><input id="newOfficeAddr" type="text" placeholder="ул. Пушкина, д. 1"></div>
        <div class="modal-actions">
            <button class="btn-secondary" onclick="closeAddOfficeModal()">Отмена</button>
            <button class="btn-primary" onclick="confirmAddOffice()">Создать</button>
        </div>
    </div>
</div>
