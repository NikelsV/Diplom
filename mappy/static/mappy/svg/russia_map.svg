<!-- Схематичная SVG-карта России. Каждый path — регион с уникальным data-region-id -->
<svg viewBox="0 0 1000 500" xmlns="http://www.w3.org/2000/svg" id="russia-map">
  <!-- Калининградская область -->
  <path class="region" data-region-id="kaliningrad" d="M95,175 L105,170 L115,175 L115,190 L105,195 L95,190 Z">
    <title>Калининградская область</title>
  </path>

  <!-- Северо-Запад (Ленинградская, Псковская, Новгородская, Мурманская, Карелия, Коми, Архангельская, Вологодская) -->
  <path class="region" data-region-id="northwest" d="M130,100 L175,80 L210,75 L240,90 L260,80 L280,95 L280,140 L260,160 L230,170 L200,165 L170,170 L140,165 L120,155 L115,130 Z">
